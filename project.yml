name: Rutawave
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
packages:
  Auth: {path: Packages/Auth}
  AppSettings: {path: Packages/AppSettings}
  InnerTube: {path: Packages/InnerTube}
  PlayerEngine: {path: Packages/PlayerEngine}
  Plugins: {path: Packages/Plugins}
  SystemKit: {path: Packages/SystemKit}
targets:
  Rutawave:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.kruhlyk.rutawave.tracks
            UTTypeDescription: Rutawave tracks
            UTTypeConformsTo: [public.data]
    dependencies:
      - package: Auth
      - package: AppSettings
      - package: InnerTube
      - package: PlayerEngine
      - package: Plugins
      - package: SystemKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kruhlyk.rutawave
        PRODUCT_NAME: Rutawave
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  RutawaveTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
      - App/Browse/BrowseModel.swift
      - App/Browse/BrowseRouting.swift
      - App/Browse/BrowseStore.swift
      - App/Components/ItemActions.swift
      - App/Components/TrackDrag.swift
      - App/Components/TrackSelection.swift
      - App/Entity/EntityLoader.swift
      - App/Entity/EntityModel.swift
      - App/Library/HistoryModel.swift
      - App/Library/LibraryLoader.swift
      - App/Library/LibraryModel.swift
      - App/Library/NewPlaylistDraft.swift
      - App/Navigation/Route.swift
      - App/Search/SearchFieldModel.swift
      - App/Search/SearchLoader.swift
      - App/Search/SearchModel.swift
      - App/Navigation/NavigationModel.swift
      - App/PlayerBar/PlaybackRules.swift
      - App/PlayerBar/NowPlayingModel.swift
      - App/PlayerBar/PlayerControlling.swift
      - App/PlayerPage/TrackTabsLoader.swift
      - App/PlayerPage/TrackTabsModel.swift
      - App/Shell/SidebarLoader.swift
      - App/Shell/SidebarModel.swift
      - App/Shell/Toast.swift
      - App/Shell/WindowLayout.swift
      - App/Components/ArtworkImage.swift
      - App/Theme/ArtworkTheme.swift
      - App/Theme/DesignTokens.swift
      - App/Theme/Glass.swift
      - App/Theme/ThemeColor.swift
    dependencies:
      - package: PlayerEngine
      - package: InnerTube
      - package: AppSettings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kruhlyk.rutawave.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
schemes:
  Rutawave:
    build:
      targets:
        Rutawave: all
    test:
      targets: [RutawaveTests]
