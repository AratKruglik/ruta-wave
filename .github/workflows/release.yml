name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          brew install xcodegen

      - name: Build DMG
        run: Scripts/make-dmg.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/dmg/RutaWave-$version.dmg" \
            --title "RutaWave $version" \
            --generate-notes \
            --notes "The app is ad-hoc signed, not notarized. After copying it to Applications, run once: \`xattr -dr com.apple.quarantine /Applications/RutaWave.app\`" \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
