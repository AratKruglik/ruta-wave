name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Forks and repositories without the secrets fall back to an ad-hoc signed, un-notarized DMG.
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
      # Without the EdDSA key the release has no Sparkle archive, so the appcast leaves it out.
      UPDATES: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      APP: build/release/Build/Products/Release/RutaWave.app
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          brew install xcodegen

      - name: Check the build number against the appcast
        if: env.UPDATES == 'true'
        run: |
          # Sparkle orders updates by CFBundleVersion (the run number), which resets if this workflow is recreated.
          feed="$(curl -fsSL https://rutawave.kruhlyk.pro/appcast.xml)" || { echo "No appcast yet"; exit 0; }
          highest="$(python3 -c 'import re,sys; print(max(map(int, re.findall(r"<sparkle:version>(\d+)</sparkle:version>", sys.stdin.read())), default=0))' <<<"$feed")"
          if (( GITHUB_RUN_NUMBER <= highest )); then
            echo "::error::Build number $GITHUB_RUN_NUMBER is not above $highest, the highest in the appcast"
            exit 1
          fi

      - name: Import Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          base64 --decode <<<"$DEVELOPER_ID_P12" > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"

      - name: Build DMG
        env:
          CODESIGN_IDENTITY: "${{ env.SIGNED == 'true' && format('Developer ID Application: Oleksii Kruhlyk ({0})', secrets.APPLE_TEAM_ID) || '' }}"
        run: Scripts/make-dmg.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: Check the update feed configuration
        if: env.UPDATES == 'true'
        run: |
          for key in SUFeedURL SUPublicEDKey; do
            if [[ -z "$(/usr/libexec/PlistBuddy -c "Print :$key" "$APP/Contents/Info.plist" 2>/dev/null)" ]]; then
              echo "::error::$key is empty, so this build would never update. Set SPARKLE_FEED_URL and SPARKLE_PUBLIC_ED_KEY in project.yml."
              exit 1
            fi
          done

      - name: Notarize and staple
        if: env.SIGNED == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          dmg="build/dmg/RutaWave-${GITHUB_REF_NAME#v}.dmg"
          key="$RUNNER_TEMP/notary.p8"
          result="$RUNNER_TEMP/notary.json"
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          printf '%s\n' "$NOTARY_KEY_P8" > "$key"
          # notarytool can exit 0 for a rejected submission, so the status decides.
          xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json > "$result" || true
          cat "$result"
          if [[ "$(plutil -extract status raw -o - "$result")" != Accepted ]]; then
            xcrun notarytool log "$(plutil -extract id raw -o - "$result")" "${auth[@]}"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          spctl -a -vvv -t install "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          # The DMG submission notarized the app inside it too; a stapled app also passes Gatekeeper offline.
          xcrun stapler staple "$APP" || echo "::warning::Could not staple the app. Sparkle updates do not need it."

      - name: Package the Sparkle update
        if: env.UPDATES == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: Scripts/sign-update.sh "$APP" build/dmg

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft, so the notes can be written for people before Publish puts the release in the appcast.
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          cp .github/release-notes-template.md "$notes"
          if [[ "$SIGNED" != true ]]; then
            printf '\n<!-- github-only -->\nThe app is ad-hoc signed, not notarized. After copying it to Applications, run once: `xattr -dr com.apple.quarantine /Applications/RutaWave.app`\n<!-- /github-only -->\n' >> "$notes"
          fi
          files=("build/dmg/RutaWave-$version.dmg")
          if [[ -f build/dmg/appcast-item.json ]]; then
            files+=("build/dmg/RutaWave-$version.zip" build/dmg/appcast-item.json)
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --draft \
            --title "RutaWave $version" \
            --notes-file "$notes" \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

      - name: Remove signing material
        if: always() && env.SIGNED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
