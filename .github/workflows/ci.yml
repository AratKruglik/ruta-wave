name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned to the Xcode the project is developed with; the app needs the macOS 26+ SDK (`#available(macOS 26, *)`, Icon Composer icon).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          brew install xcodegen

      - name: Script tests
        run: python3 -m unittest discover -s Scripts -p 'test_*.py'

      - name: Package tests
        run: |
          for package in Packages/*/; do
            echo "::group::$package"
            swift test --package-path "$package"
            echo "::endgroup::"
          done

      - name: App build and tests
        run: |
          xcodegen generate
          xcodebuild test \
            -project Rutawave.xcodeproj \
            -scheme Rutawave \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci \
            -quiet
